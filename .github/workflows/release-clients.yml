name: Release ORF clients

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.0.1"
        required: true
        default: "v0.0.1"

permissions:
  contents: write

env:
  NODE_VERSION: "22.22.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ORF_CLIENT_URL: ${{ vars.ORF_CLIENT_URL || 'https://orf-xueyu.duckdns.org:8443/' }}

jobs:
  windows-client:
    name: Build Win11 installer
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_TAG=${{ inputs.release_tag }}" >> $env:GITHUB_ENV
          } else {
            "RELEASE_TAG=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          $nodePath = (Get-Command node).Source
          & $nodePath --version
          & $nodePath scripts/build-desktop-client.mjs --win nsis --x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: orf-win11-installer
          path: release/desktop/ORF-*-win11-x64-setup.exe
          if-no-files-found: error

  android-client:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run client:android:assemble:debug

      - name: Collect Android artifact
        shell: bash
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/android/ORF-${RELEASE_TAG}-android-preview.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: orf-android-preview-apk
          path: release/android/ORF-*-android-preview.apk
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - windows-client
      - android-client

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          current_ref="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || git rev-parse HEAD)"
          previous_tag="$(git tag --merged "$current_ref" --sort=-version:refname | grep -E '^v[0-9]+' | grep -vx "$RELEASE_TAG" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            commit_range="${previous_tag}..${RELEASE_TAG}"
            range_label="${previous_tag} 到 ${RELEASE_TAG}"
          else
            commit_range="$RELEASE_TAG"
            range_label="初始版本到 ${RELEASE_TAG}"
          fi

          {
            echo "ORF ${RELEASE_TAG}"
            echo
            echo "本次更新范围：${range_label}。"
            echo
            echo "主要改动："
            if git log --reverse --pretty=format:'- %s' "$commit_range" | sed '/^$/d' >> release-notes.tmp; then
              if [ -s release-notes.tmp ]; then
                cat release-notes.tmp
              else
                echo "- 本次版本主要包含客户端构建和发布流程整理。"
              fi
            else
              echo "- 本次版本主要包含客户端构建和发布流程整理。"
            fi
            rm -f release-notes.tmp
            echo
            echo "客户端包："
            echo "- Win11 PC 端：Electron 安装器，打开 ${ORF_CLIENT_URL}"
            echo "- Android 移动端：Capacitor 预览 APK，打开 ${ORF_CLIENT_URL}"
            echo
            echo "安装后提示："
            echo "- 用户安装新客户端后，应用会读取本 Release 的中文说明并在首次启动时提示。"
            echo "- 后续版本会继续用 GitHub Release 正文作为应用内更新说明的唯一来源。"
            echo
            echo "数据和权限来源："
            echo "- 客户端不保存业务数据。"
            echo "- 聊天、权限、附件、登录态仍以 ORF Web 服务端和数据库为唯一事实源。"
            echo
            echo "已知边界："
            echo "- Win11 安装器当前未做代码签名，首次安装时 Windows 可能提示发布者未知。"
            echo "- Android 当前是内部预览 APK。后续要支持稳定覆盖升级，需要把 Android release keystore 放到 GitHub Secrets，再切换到正式签名构建。"
          } > release-notes.md

      - name: Publish assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were produced." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "ORF $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "ORF $RELEASE_TAG" --notes-file release-notes.md
          fi
