version: v0.13.0

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:5173
        - http://localhost:5173
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:5173/auth
  allowed_return_urls:
    - http://127.0.0.1:5173
    - http://localhost:5173

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: false

  flows:
    error:
      ui_url: http://127.0.0.1:5173/auth
    settings:
      ui_url: http://127.0.0.1:5173/auth
      privileged_session_max_age: 15m
    recovery:
      enabled: false
      ui_url: http://127.0.0.1:5173/auth
      use: code
    verification:
      enabled: false
      ui_url: http://127.0.0.1:5173/auth
      use: code
      after:
        default_browser_return_url: http://127.0.0.1:5173/auth
    logout:
      after:
        default_browser_return_url: http://127.0.0.1:5173/auth
    login:
      ui_url: http://127.0.0.1:5173/auth
      lifespan: 10m
    registration:
      ui_url: http://127.0.0.1:5173/auth
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

log:
  level: info
  format: text

secrets:
  cookie:
    - PLEASE-CHANGE-ME-ORF-DEV-COOKIE-SECRET
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

feature_flags:
  use_continue_with_transitions: true
