x-kratos-runtime: &kratos-runtime
  image: oryd/kratos:v26.2.0
  platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}

services:
  kratos-migrate:
    <<: *kratos-runtime
    env_file:
      - ./ory/.runtime/ory.env
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
      - ./ory/.runtime/certs:/etc/ory/certs:ro
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure

  kratos:
    <<: *kratos-runtime
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    env_file:
      - ./ory/.runtime/ory.env
    environment:
      LOG_LEVEL: info
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
      - ./ory/.runtime/certs:/etc/ory/certs:ro
    ports:
      - "127.0.0.1:${ORY_PUBLIC_PORT:-4433}:4433"
      - "127.0.0.1:${ORY_ADMIN_PORT:-4434}:4434"
    command: serve -c /etc/config/kratos/kratos.yml --dev
    restart: unless-stopped
